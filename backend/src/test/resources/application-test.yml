spring:
  config:
    import:
      - "optional:file:./application-test-local.yml"
      - "optional:file:../application-test-local.yml"
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3306/clothing_shop_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${TEST_DB_USERNAME:shop}
    password: ${TEST_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration

app:
  seed:
    dev:
      enabled: false
  jwt:
    secret: ${JWT_SECRET}
  einvoice:
    provider:
      type: mock
    outbox:
      worker-enabled: false

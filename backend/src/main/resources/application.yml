spring:
  application:
    name: clothing-shop-backend
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://localhost:3306/clothing_shop_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: shop
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 1800000
    refresh-expiration-ms: 604800000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  upload:
    dir: uploads/products
  seed:
    dev:
      enabled: ${SEED_DEV_ENABLED:false}
      admin-email: ${SEED_ADMIN_EMAIL:#{null}}
      admin-password: ${SEED_ADMIN_PASSWORD:#{null}}
  einvoice:
    provider:
      type: ${EINVOICE_PROVIDER_TYPE:mock}
    outbox:
      worker-enabled: ${EINVOICE_OUTBOX_WORKER_ENABLED:false}
      batch-size: ${EINVOICE_OUTBOX_BATCH_SIZE:10}
      poll-interval-ms: ${EINVOICE_OUTBOX_POLL_INTERVAL_MS:5000}
      reconciliation-poll-interval-ms: ${EINVOICE_OUTBOX_RECONCILE_POLL_INTERVAL_MS:15000}
      lease-reaper-interval-ms: ${EINVOICE_OUTBOX_REAPER_INTERVAL_MS:30000}
      lease-duration-seconds: ${EINVOICE_OUTBOX_LEASE_DURATION_SECONDS:120}
      max-attempts: ${EINVOICE_OUTBOX_MAX_ATTEMPTS:5}
      max-reconcile-attempts: ${EINVOICE_OUTBOX_MAX_RECONCILE_ATTEMPTS:10}
      initial-backoff-seconds: ${EINVOICE_OUTBOX_INITIAL_BACKOFF_SECONDS:10}
      backoff-multiplier: ${EINVOICE_OUTBOX_BACKOFF_MULTIPLIER:2.0}
      max-backoff-seconds: ${EINVOICE_OUTBOX_MAX_BACKOFF_SECONDS:900}


springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
